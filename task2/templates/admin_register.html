{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2><i class="fas fa-user-tie" style="color: var(--primary); margin-right: 10px;"></i> Admin Registration</h2>
    
    <div style="background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; text-align: center;">
        Note: Only one admin account can be created per system.
    </div>

    <form method="POST">
        <input type="text" name="username" placeholder="Admin Username" required>
        <input type="password" name="password" placeholder="Admin Password" required>
        <button type="submit" style="background-color: var(--accent);">Register as Admin</button>
    </form>
</div>
{% endblock %}
