<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethnotech Shopping</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <a href="/" class="brand"><i class="fas fa-shopping-bag"></i> Ethnotech</a>
        
        <div class="nav-links">
            <a href="/">Home</a>
            {% if session.get('username') %}
                <a href="/dashboard">Dashboard</a>
                <span style="color: var(--text-muted);">Hi, {{ session.get('username') }}</span>
                <a href="/logout" class="btn-login" style="background-color: #EF4444;">Logout</a>
            {% else %}
                <a href="/user_register">User Register</a>
                <a href="/admin_register">Admin Register</a>
                <a href="/login" class="btn-login">Login</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
